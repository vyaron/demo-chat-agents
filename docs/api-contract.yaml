openapi: 3.0.3
info:
  title: QuickChat API
  version: 1.0.0
  description: >
    Defined by the Frontend Agent (CHAT-1).
    Backend Agent (CHAT-2) must implement this contract exactly.

servers:
  - url: http://localhost:3001
    description: Local development

paths:
  /api/conversations:
    get:
      summary: List all conversations
      operationId: listConversations
      responses:
        "200":
          description: Array of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"

  /api/conversations/{id}/messages:
    get:
      summary: Get message history for a conversation
      operationId: getMessages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Array of messages ordered by created_at ASC
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"

    post:
      summary: Send a message (REST fallback — primary path is WebSocket)
      operationId: sendMessage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sender_id, sender_name, content]
              properties:
                sender_id:
                  type: string
                sender_name:
                  type: string
                content:
                  type: string
                  minLength: 1
      responses:
        "201":
          description: Created message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Validation error

  /api/conversations/{id}/messages/search:
    get:
      summary: Search messages in a conversation by text content
      operationId: searchMessages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: true
          description: Search query term (case-insensitive substring match)
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Array of messages matching the query, ordered by created_at ASC
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "400":
          description: Bad request (missing q parameter)
        "404":
          description: Conversation not found

  /health:
    get:
      summary: Health check
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

components:
  schemas:
    Conversation:
      type: object
      required: [id, name, avatar_url]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        avatar_url:
          type: string
        last_message:
          type: string
          nullable: true
        last_message_at:
          type: string
          format: date-time
          nullable: true
        unread_count:
          type: integer
          default: 0

    Message:
      type: object
      required: [id, conversation_id, sender_id, sender_name, content, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        sender_id:
          type: string
        sender_name:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time

# ─── WebSocket Events ──────────────────────────────────────────────────────────
# Transport: Socket.io over ws://localhost:3001
#
# CLIENT → SERVER:
#   join_room      { conversationId: string }
#   leave_room     { conversationId: string }
#   send_message   { conversationId, senderId, senderName, content }
#   user_typing    { conversationId, senderName }
#
# SERVER → CLIENT:
#   joined_room    { conversationId: string }         — confirms join
#   new_message    Message                             — broadcast to room
#   user_typing    { senderName: string }             — relay to room
#   error          { message: string }                — on failure
